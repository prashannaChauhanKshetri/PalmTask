services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOTE: Pinecone and OpenAI are external SaaS services.
    # Provide OPENAI_API_KEY, PINECONE_API_KEY, and PINECONE_INDEX_NAME
    # in your .env file — they are NOT managed by this compose stack.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: palm
      POSTGRES_PASSWORD: palm
      POSTGRES_DB: palm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palm -d palm"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
